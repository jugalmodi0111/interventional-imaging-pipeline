task: avf_fistulography_triage                                   # Dialygo Model One — normal vs. significant stenosis triage aid (B1/B3)
segment: juxta_anastomotic                                        # B2 build-order table: densest segment, built FIRST; not anastomosis/body/etc. (later stages)
data: {root: data/raw/avf_fistulography}                          # institutional (Institute of Nephro-Urology) — GATED on the data-use agreement (B5); public/synthetic/own non-patient data only until it is signed
input: {frame: single_still, format: png, deidentified: true, crop: segment, imgsz: 224}   # B3: one still angiographic frame per prediction, cropped to the segment; imgsz is what's fed to the backbone
model: {backbone: vit_base_patch14_dinov2.lvd142m, frozen: true, head: linear}   # B4: frozen foundation backbone + lightweight trained head; sample-efficiency is the fixed requirement, not this specific backbone. NAME CORRECTED 2026-08-25: `dinov2_vitb14` is a torch.hub name and timm cannot build it (RuntimeError: Unknown model) -- it had never been exercised because every test used the offline `test-tiny` backbone
# backbone bake-off candidates (edit model.backbone above; do not assume DINOv2 wins — plan §3.11 / STAGE_ACCURACY_RESEARCH.md):
# model.backbone: vit_base_patch16_dinov3   # eventual target per B4; present in timm 1.0.28, verify licence for hosted deployment
# model.backbone: rad_dino        # radiology-pretrained candidate
# model.backbone: biomedclip      # biomedical-image-text candidate
split: {by: patient}                                              # B5: patient-level split only — no patient may appear in both train and test
labels_from: clinical_lead                                        # B7: Dr. Reddy is ground truth; multi-reader consensus where feasible; the engineer does not define "abnormal"
metrics: [sensitivity, specificity, auroc, ece]                   # classification metrics only — NOT Dice (segmentation) and NOT mAP (detection); see plan delta §3.4
target: {sensitivity: null, specificity: null}                    # PROVISIONAL — accuracy floors NOT yet set with clinical stakeholders; unset until Dr. Reddy signs off. Do not treat any number here as authoritative (cf. the contested 0.57 floor debated in configs/stenosis_yolo.yaml)
calibration: {method: temperature_scaling, temperature: 1.0}      # B3: calibrated confidence, not a bare yes/no; T==1.0 is a no-op until tuned post-hoc via src/eval/calibration.py
defer: {band: [0.3, 0.6], keep_conf: 0.5}                         # B3: calibrated confidence inside the band -> triage output defaults to uncertain/refer, never a false "normal"; parameterization mirrors src/serve/stenosis_triage.py's defer_band/keep_conf. Bounds are that module's existing defaults reused as placeholders — same provisional caveat as target above, pending real calibration data
external_val: {site: TBD, required: true}                         # B6: first-class deliverable — performance must be reported on >=1 site other than the source institute before any claim or deployment; site not yet identified
