task: stenosis_detection
datasets:
  arcade_stenosis: {root: data/raw/arcade/stenosis, task: 2, format: coco}   # stenosis split only
  danilov:         {root: data/raw/danilov, format: coco, max_frames_per_patient: 5}   # cap 5/patient: 64 patients/8325 frames dilute the honest metric (arcade-only 0.246 > +danilov 0.214)
  cadica:          {root: data/raw/cadica, format: native, max_frames_per_patient: 40, negatives_per_positive: 0.25}   # 2024 patient-diverse lesion angiography; run cadica_to_yolo prep to include (patients > frames). cap 40/patient: 3996 keyframes over ~42 patients are near-duplicates -> cap cuts redundancy + val-fraction variance
  # negatives_per_positive 1.0 (0 = off, the pre-2026-08-16 behaviour): sample that many BACKGROUND
  # frames per CADICA positive written, drawn from CADICA's NON-LESION videos ONLY (per-patient
  # lesionVideos.txt/nonlesionVideos.txt; an unannotated frame inside a LESION video is NOT a
  # negative -- the lesion is there, CADICA just annotates keyframes -- and feeding those in would
  # destroy recall). Each is written with an EMPTY label file, which is what ultralytics counts as a
  # background. Before this, the corpus had 0% background images -- ultralytics printed
  # "0 backgrounds" on every scan -- so the detector never saw a lesion-free frame and learned to
  # always fire (per-video false-flag rate ~1.0, negative Youden J; docs/STENOSIS_ARCHITECTURE_AUDIT
  # .md A1). ~400 non-lesion CADICA videos (~40-120k frames) were sitting unused.
  # SWEPT 2026-08-23 (experiments/stenosis_neg1.0_yolo11s_768_e80/RESULTS.md). 0 / 0.25 / 1.0 ->
  # 0% / 10.5% / 31.9% background. More background monotonically improves per-video discrimination
  # (Youden J at conf 0.10: -0.052 -> +0.033 -> +0.212), BUT it erodes the MAX ACHIEVABLE per-video
  # sensitivity: 0.931 -> 0.902 -> 0.882. At 1.0 the model cannot reach 0.90 sensitivity at ANY
  # threshold, so it fails the clinical floor before specificity is even considered. 0.25 is the only
  # swept value that improves discrimination AND keeps the sensitivity ceiling at the floor -- and it
  # is also the per-frame optimum (F1 0.288 vs 0.252 at 1.0). Do NOT raise this to 2.0.
  # SIZING, honestly: ultralytics' own guidance is ~0-10% background images to suppress false
  # positives. CADICA is roughly half the pooled 3409-image corpus, so 1.0 puts the WHOLE corpus
  # near 30% background -- deliberately well ABOVE that guidance, because the corpus is coming from
  # 0% and the failure being corrected is total (specificity 0.00-0.25). Treat 1.0 as the first
  # value to sweep, not a tuned one: the conversion line prints the achieved background_frac, and
  # the right setting is whatever the P1.1b/c per-video sensitivity/specificity table says. Lower it
  # if per-video sensitivity drops -- a missed stenosis is the deadly error.
model: {name: yolo11s, imgsz: 768, pretrained: true}          # 's' + 768: cross the F1 floor (nano/640 sat at 0.25). Still edge-deployable.
# P2.3 model/resolution sweep (edit the line above, then `yolo_to_coreml --smoketest` the result on Mac):
# model: {name: yolo11m, imgsz: 768, pretrained: true}        # ~2x latency/size vs 's'; still ANE-viable. Data-limited -> expect small gains.
# model: {name: yolo11s, imgsz: 1024, pretrained: true}       # higher res helps the smallest lesions' recall; latency ~quadratic -> bench on device.
# model.pretrained_weights: runs/ssl/xca_backbone.pt          # SSL/angiography-pretrained backbone drop-in (produce GPU-side; loaded strict=False before train)
# if T4 OOMs at 768/batch16: drop train.batch to 8 (or set -1 for auto).
ssl:   {pseudo_label: true, conf: 0.4, max_background_frac: 0.5,
        restart_from: pretrained}   # semi-supervised boost (P2.2: the confirmed data lever)
# restart_from (DEFAULT 'pretrained' = the behaviour every run so far): WHICH checkpoint an SSL round
# retrains from, in both the pseudo-label and the Grounding-DINO seed round.
#   pretrained -> re-init from the stock <model.name>.pt. The round learns only from the
#                 pseudo-labels, so the model can't reinforce its own errors through its own weights
#                 (confirmation-bias guard) -- but it DISCARDS everything the base run learned except
#                 what survived into the labels, and pays for a full cold retrain each round.
#   current    -> continue from the weights that just produced the pseudo-labels. Keeps that
#                 learning and converges faster, at the risk of entrenching its own pseudo-label
#                 mistakes -- sharpest here, where an over-firing detector relabels its own false
#                 positives as ground truth (docs/STENOSIS_ARCHITECTURE_AUDIT.md A3).
# Anything else raises (it is never silently ignored). Sweep it like max_background_frac, don't assume.
# max_background_frac (DEFAULT 0.5): an unlabeled frame the detector fires NOTHING on is written as a
# BACKGROUND (image + EMPTY label file = a negative to ultralytics), not discarded. Discarding them is
# what left the corpus at 0% negatives, so the detector flags ~100% of lesion-free clips; ultralytics'
# own guidance is 0-10% background images. The cap keeps backgrounds to at most this fraction of the
# frames a round adds, so a detector that fires on nothing can't flood images/train with pure
# background (0 positives -> 0 backgrounds). 0.0 = off (the old positives-only round); >=1.0 = uncapped.
# Which frames survive the cap is deterministic (sorted + evenly spaced, no RNG).
# ssl.unlabeled_dir MUST point at a DISJOINT unlabeled set (no val patients) or SSL stays OFF — the
# notebook auto-sets it to data/raw/xcad when an XCAD dataset is attached. XCAD (~1621 frames) is a
# separate cohort from ARCADE/CADICA/Danilov, so it's disjoint by construction (safe to self-train on).
# ssl.unlabeled_dir: data/raw/xcad
# ssl.seed: gdino  -> open-vocab Grounding DINO cold-start on the unlabeled frames before self-training
#                    (needs transformers + a GPU; runs on ssl.unlabeled_dir, a better cold start than
#                     a YOLO trained on scarce labels)
train: {epochs: 80, batch: 16, lr: 1.0e-3,
        cache: true, workers: 8, patience: 30, amp: true}     # epochs 150->80: val saturated ~ep16, best ~ep39 (see experiments/..._e150). RAM cache + AMP + early-stop.
# Domain-tuned augmentation (Phase 1, docs/STAGE2_PHASE1_POA.md P1.2). YOLO COCO defaults are wrong
# for tiny (23-115px) faint grayscale lesions: mosaic never closed, scale/erasing shrink/erase them,
# HSV is a grayscale no-op. Flows through train_detector.train_kwargs -> ultralytics model.train().
augment:
  mosaic: 0.0            # A/B this vs 0.3: 0.0 is safest for tiny objects (mosaic downscales/composites)
  close_mosaic: 15       # if mosaic>0, guarantees a mosaic-off tail actually fires before the run ends
  scale: 0.2             # was 0.5 — ±50% scale jitter loses the smallest lesions
  erasing: 0.0           # was 0.4 — random-erase can delete the lesion itself
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0             # grayscale angiography: HSV jitter is wasted compute
  fliplr: 0.5            # keep
  translate: 0.1         # keep
  degrees: 0.0
  cos_lr: true           # smoother decay for the shortened 80-epoch schedule
  box: 9.0               # was 7.5 — push localization (mAP50-95 was 0.080 vs mAP50 0.209)
  dfl: 2.0               # was 1.5
# P2.1 box-size harmonization: clamp tiny boxes up to a min w/h floor (fixes the source convention
# mismatch the §3c annotation QA shows — danilov boxes ~4x smaller than arcade, tiny_frac 0.36).
# min_box_wh 0 = OFF (default; keeps the baseline). Set ~0.04 (~30px at 768) to enable.
# TRADE-OFF (audit B5): TRAIN-ONLY keeps val comparable to the baseline but trains the model to emit
# boxes LARGER than the un-harmonized val target, which can LOWER mAP50 and hits mAP50-95 harder. If
# you enable it, score the same weights on BOTH the original and a harmonized val ([train, val]).
harmonize: {min_box_wh: 0.0, splits: [train]}
metrics: [coco_ap, f1]
val:    {conf: 0.001}                                         # low eval conf so recall (the costly axis) isn't throttled; add val.iou to override NMS IoU
# Recall-first gate (Phase 1): a missed stenosis is the deadly error. qualifies_det requires BOTH
# F1>=f1 AND recall>=recall. Surfaces recall in the gate line; expect FAIL until the levers land.
# --- ACCEPTANCE GATE -------------------------------------------------------------------------
# 2026-08-16: the per-FRAME gate below was answered by measurement and is no longer the primary
# criterion. Per-video sensitivity is 0.902 (92/102 held-out lesion videos) while per-frame recall
# is 0.27 -- the product deploys a screening flag that fires per STUDY, not per frame, so per-frame
# F1 was measuring something the product does not do. Dr. Reddy accepted the reframe ("good to go
# but have to improve a bit") and asked for high precision, but gave NO numbers for either axis.
# Per repo convention (cf. avf_fistulography.yaml sensitivity: null) an unquantified target is NOT
# signed off, so the new gate stays null until signature. See docs/STENOSIS_GATE_PROPOSAL.md.
target_per_video:
  sensitivity: null      # PROPOSED 0.95 (a reading of "improve a bit" from 0.902) -- UNSIGNED
  specificity: null      # BLOCKED: needs expected prevalence + target PPV; not yet measured either
  operating_conf: null   # pick from the P1.1c sweep once specificity is signed off
  signed_off: false
# Per-FRAME gate, DEMOTED but still enforced. Do NOT delete these keys to retire it:
# train_detector.qualifies_det defaults to f1=0.57 when target.f1 is absent, so removing the key
# silently re-imposes the same floor. It stays here, explicit and truthful, until the per-video gate
# is signed and a per-video gate function exists (none does yet -- P1.1b/c runs in the notebook).
target: {f1: 0.57, recall: 0.60}                             # per-frame; NOT the product's metric
# target: {f1: 0.57}                                          # prior F1-only gate (recall unweighted)
export: {onnx: true, int8: true, tensorrt: false}
